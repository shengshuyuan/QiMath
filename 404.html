<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 启数乐学</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #F8F7F2;
      color: #2C3A47;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(44, 58, 71, 0.08);
      text-align: center;
    }
    .code {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #FFF1E8;
      color: #E8713A;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    h1 {
      margin: 16px 0 10px;
      font-size: 26px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 26px;
      color: #5C6B77;
      font-size: 16px;
      line-height: 1.6;
    }
    a.home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #E8713A;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    a.home-btn:hover {
      background: #D6622C;
    }
    a.home-btn:focus-visible {
      outline: 3px solid #2C3A47;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>404 · 页面走丢啦</h1>
    <p>这个地址不存在或已移动。</p>
    <a class="home-btn" href="/">返回启数乐学首页</a>
  </main>
</body>
</html>
